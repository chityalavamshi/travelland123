apiVersion: apps/v1
kind: Deployment
metadata:
  name: travelland
spec:
  replicas: 2
  selector:
    matchLabels:
      app: travelland
  template:
    metadata:
      labels:
        app: travelland
    spec:
      containers:
        - name: travelland
          image: 401844779865.dkr.ecr.ap-south-1.amazonaws.com/travelland:1.0
          ports:
            - containerPort: 80
